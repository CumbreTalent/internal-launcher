<script>
  // Sign-in guard. Keep the page hidden until /api/apps confirms a signed-in,
  // allowed account; otherwise send them to the launcher's sign-in form, which
  // brings them back here afterwards. This is a convenience gate on a static
  // file, not a security boundary — see "What this protects" in the README.
  document.documentElement.style.visibility = 'hidden'
  // Inside the launcher's app window the launcher has its own Home button.
  if (window.top !== window.self) document.documentElement.classList.add('in-launcher')
  LauncherAuth.apps().then(function (r) {
    if (r.status === 200) { document.documentElement.style.visibility = ''; return }
    location.replace('./index.html?next=' + encodeURIComponent(location.pathname))
  }).catch(function () { document.documentElement.style.visibility = '' })
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
:root {
  --bg: #0f0f0f;
  --surface: #181818;
  --surface2: #222222;
  --surface3: #2a2a2a;
  --border: #2e2e2e;
  --border2: #3a3a3a;
  --text: #f0ede8;
  --muted: #777;
  --muted2: #555;
  --accent: #e8651a;
  --accent-hover: #d45a15;
  --accent2: #f0a05a;
  --green: #4caf7d;
  --red: #e05555;
  --blue: #5b8dee;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

.wf-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.wf-bar .logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.08em; }
.wf-bar .logo span { color: var(--accent); }
.wf-bar .tag { font-size: 11px; color: var(--muted); }
.wf-bar a.back { margin-left: auto; color: var(--muted); text-decoration: none; font-size: 13px; }
.wf-bar a.back:hover { color: var(--text); }

/* ── Workflow layout (ported from offload-quote-builder/src/style.css) ── */
.wf-layout {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

.wf-map-col {
  flex-shrink: 0;
  width: 100%;
  padding: 28px 24px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.wf-map-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
  text-align: center;
}

.wf-map-hint {
  font-size: 12px;
  color: var(--muted2);
  margin-bottom: 8px;
  line-height: 1.4;
  text-align: center;
}

.wf-svg {
  width: 100%;
  max-width: 820px;
  height: auto;
  display: block;
  margin: 0 auto;
}

.wf-node-group { cursor: pointer; }
.wf-node-fill { opacity: 0.1; transition: opacity 0.2s; }
.wf-node-ring { opacity: 0.4; transition: opacity 0.2s, stroke-width 0.2s; }
.wf-node-group:hover .wf-node-fill { opacity: 0.24; }
.wf-node-group:hover .wf-node-ring { opacity: 1; }

.wf-layout[data-active="quote"] [data-wf="quote"] .wf-node-fill,
.wf-layout[data-active="invoice"] [data-wf="invoice"] .wf-node-fill,
.wf-layout[data-active="social"] [data-wf="social"] .wf-node-fill { opacity: 0.28; }

.wf-layout[data-active="quote"] [data-wf="quote"] .wf-node-ring,
.wf-layout[data-active="invoice"] [data-wf="invoice"] .wf-node-ring,
.wf-layout[data-active="social"] [data-wf="social"] .wf-node-ring { opacity: 1; stroke-width: 3.5; }

.wf-detail-col {
  flex: 1;
  min-width: 0;
  padding: 24px 28px 40px;
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
}

.wf-empty-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 60px 20px;
  color: var(--muted2);
  text-align: center;
}
.wf-empty-icon { font-size: 34px; color: var(--border2); }
.wf-empty-text { font-size: 14px; max-width: 320px; line-height: 1.5; }
.wf-layout[data-active="quote"] .wf-empty-hint,
.wf-layout[data-active="invoice"] .wf-empty-hint,
.wf-layout[data-active="social"] .wf-empty-hint { display: none; }

.wf-detail-panel { display: none; animation: wfFade 0.25s ease; }
.wf-layout[data-active="quote"] .wf-detail-panel[data-wf="quote"],
.wf-layout[data-active="invoice"] .wf-detail-panel[data-wf="invoice"],
.wf-layout[data-active="social"] .wf-detail-panel[data-wf="social"] { display: block; }

@keyframes wfFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.wfd-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.wfd-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  margin-top: 4px;
  flex-shrink: 0;
}

.wfd-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 5px;
}

.wfd-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}

.wfs-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.wfs-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.wfs-card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
}

.wfs-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

.wfs-stage-name {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--text);
}

.wfs-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.wfs-col {
  padding: 12px 14px;
}

.wfs-col--client {
  background: #0f1929;
  border-right: 1px solid var(--border);
}

.wfs-col--us {
  background: #1c1108;
}

.wfs-col-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 9px;
  color: #7faff0;
}

.wfs-col--us .wfs-col-title { color: var(--accent); }

.wfs-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
  padding: 0;
}

.wfs-list li {
  font-size: 12px;
  color: #c8c3bc;
  line-height: 1.45;
  padding-left: 13px;
  position: relative;
}

.wfs-list--client li::before {
  content: '\203A';
  position: absolute;
  left: 0;
  color: #7faff0;
  font-weight: 700;
}

.wfs-list--us li::before {
  content: '\203A';
  position: absolute;
  left: 0;
  color: var(--accent);
  font-weight: 700;
}

.wfd-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.wfd-tab {
  padding: 9px 22px;
  font-size: 13px;
  font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  transition: color 0.15s, border-color 0.15s;
  margin-bottom: -1px;
}
.wfd-tab:hover { color: var(--text); }
.wfd-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.wfd-section { display: none; }
.wf-detail-panel[data-section="onboarding"] .wfd-section[data-sec="onboarding"],
.wf-detail-panel[data-section="workflow"]   .wfd-section[data-sec="workflow"]   { display: block; }

/* ── Swimlane grid (track × phase) ── */
.sl-grid { display: flex; flex-direction: column; gap: 2px; overflow-x: auto; }
.sl-row { display: grid; gap: 2px; }
.sl-header { margin-bottom: 2px; }
.sl-track-label { }
.sl-phase {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 9px 12px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-align: center;
}
.sl-track-name {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 10px 14px 10px 0;
  text-align: right;
}
.sl-track-name span {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 0.05em;
  line-height: 1.05;
}
.sl-cell {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-height: 84px;
}
.sl-cell--empty { background: #141414; border-color: #1e1e1e; }

.sl-node {
  border: 1px solid transparent;
  border-left-width: 3px;
  border-radius: 3px;
  padding: 8px 10px;
}
.sl-node-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text);
  margin-bottom: 3px;
}
.sl-node-detail { font-size: 11px; color: var(--muted); line-height: 1.4; }
.sl-node-tool {
  display: inline-block;
  margin-top: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 2px;
}
.sl-freq {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-top: 5px;
}
.sl-platforms { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.sl-badge {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.05em;
  padding: 2px 5px;
  border-radius: 2px;
  border: 1px solid var(--border2);
  color: var(--muted);
}
.sl-badge--fb { border-color: #3b5998; color: #6d8fd6; background: rgba(59,89,152,0.12); }
.sl-badge--ig { border-color: #e1306c; color: #e1306c; background: rgba(225,48,108,0.12); }
.sl-badge--tt { border-color: #69c9d0; color: #69c9d0; background: rgba(105,201,208,0.12); }

.sl-tools-divider {
  height: 1px;
  background: var(--border);
  margin: 30px 0 22px;
  position: relative;
}
.sl-tools-divider::before {
  content: attr(data-label);
  position: absolute;
  top: -8px;
  left: 0;
  background: var(--bg);
  padding: 0 10px 0 0;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
}
.sl-tools {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 8px;
}
.sl-tool-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
.sl-tool-cat {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 6px;
}
.sl-tool-name { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 0.04em; color: var(--text); }
.sl-tool-desc { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.45; }

@media (max-width: 820px) {
  .wf-layout { overflow: visible; }
  .wf-map-col { padding: 20px 14px; }
  .wf-detail-col { overflow: visible; padding: 18px 14px 32px; }
  .wfs-grid { grid-template-columns: 1fr; }
  .wfs-body { grid-template-columns: 1fr; }
  .wfs-col--client { border-right: none; border-bottom: 1px solid var(--border); }
  .sl-grid { min-width: 720px; }
}
.in-launcher .wf-bar .back { display: none; }
</style>
</head>

    const PLATFORM_LABELS = { fb: 'FB', ig: 'IG', tt: 'TT' }

    function swimlaneNode(node, color) {
      const tool = node.tool ? `<span class="sl-node-tool" style="background:${color}26;color:${color}">${node.tool}</span>` : ''
      const platforms = node.platforms && node.platforms.length
        ? `<div class="sl-platforms">${node.platforms.map(p => `<span class="sl-badge sl-badge--${p}">${PLATFORM_LABELS[p] || p}</span>`).join('')}</div>`
        : ''
      const freq = node.freq ? `<div class="sl-freq">→ ${node.freq}</div>` : ''
      return `
        <div class="sl-node" style="border-left-color:${color};background:${color}14">
          <div class="sl-node-title">${node.title}</div>
          <div class="sl-node-detail">${node.detail}</div>
          ${tool}
          ${platforms}
          ${freq}
        </div>`
    }

    function renderSwimlane(sl) {
      if (!sl) return ''
      const cols = `grid-template-columns: 150px repeat(${sl.phases.length}, 1fr)`
      const header = `
        <div class="sl-row sl-header" style="${cols}">
          <div class="sl-track-label"></div>
          ${sl.phases.map(p => `<div class="sl-phase">${p}</div>`).join('')}
        </div>`
      const rows = sl.tracks.map(track => `
        <div class="sl-row" style="${cols}">
          <div class="sl-track-name"><span style="color:${track.color}">${track.name}</span></div>
          ${sl.phases.map((_, i) => {
            const nodes = track.cells[i] || []
            return nodes.length
              ? `<div class="sl-cell">${nodes.map(n => swimlaneNode(n, track.color)).join('')}</div>`
              : `<div class="sl-cell sl-cell--empty"></div>`
          }).join('')}
        </div>`).join('')
      const tools = sl.tools && sl.tools.length ? `
        <div class="sl-tools-divider" data-label="Tool Stack"></div>
        <div class="sl-tools">
          ${sl.tools.map(t => `
            <div class="sl-tool-card">
              <div class="sl-tool-cat">${t.cat}</div>
              <div class="sl-tool-name">${t.name}</div>
              <div class="sl-tool-desc">${t.desc}</div>
            </div>`).join('')}
        </div>` : ''
      return `<div class="sl-grid">${header}${rows}</div>${tools}`
    }

    function stageCards(wf) {
      return wf.stages.map((s, idx) => `
        <div class="wfs-card">
          <div class="wfs-card-head">
            <div class="wfs-num" style="background:${wf.color}22;color:${wf.color}">${idx + 1}</div>
            <div class="wfs-stage-name">${s.label}</div>
          </div>
          <div class="wfs-body">
            <div class="wfs-col wfs-col--client">
              <div class="wfs-col-title">👤 Client Provides</div>
              <ul class="wfs-list wfs-list--client">${s.client.map(i => `<li>${i}</li>`).join('')}</ul>
            </div>
            <div class="wfs-col wfs-col--us">
              <div class="wfs-col-title" style="color:${wf.color}">⚡ We Handle</div>
              <ul class="wfs-list wfs-list--us" style="--accent-wf:${wf.color}">${s.us.map(i => `<li>${i}</li>`).join('')}</ul>
            </div>
          </div>
        </div>`).join('')
    }

    function renderWorkflowMap() {
      const detailPanels = Object.values(WORKFLOW_DATA).map(wf => `
        <div class="wf-detail-panel" data-wf="${wf.id}" data-section="onboarding">
          <div class="wfd-header">
            <div class="wfd-dot" style="background:${wf.color}"></div>
            <div>
              <div class="wfd-title">${wf.label}</div>
              <div class="wfd-desc">${wf.description}</div>
            </div>
          </div>

          <div class="wfd-tabs">
            <button class="wfd-tab active" onclick="window.setWorkflowSection(this,'onboarding')">Onboarding</button>
            <button class="wfd-tab" onclick="window.setWorkflowSection(this,'workflow')">Workflow</button>
          </div>

          <div class="wfd-section" data-sec="onboarding">
            <div class="wfs-grid">${stageCards(wf)}</div>
          </div>

          <div class="wfd-section" data-sec="workflow">
            ${renderSwimlane(SWIMLANE_DATA[wf.id])}
          </div>
        </div>`).join('')

      const nodes = [
        { id: 'quote',   x: 150, color: '#e8651a', l1: 'Quote',   l2: 'Generation' },
        { id: 'invoice', x: 460, color: '#5b8dee', l1: 'Invoice', l2: 'Follow-Up' },
        { id: 'social',  x: 770, color: '#4caf7d', l1: 'Social',  l2: 'Media' },
      ]
      const cy = 78
      const nodeMarkup = nodes.map(n => `
        <g class="wf-node-group" data-wf="${n.id}" onclick="window.setActiveWorkflow('${n.id}')">
          <circle cx="${n.x}" cy="${cy}" r="40" class="wf-node-fill" fill="${n.color}"/>
          <circle cx="${n.x}" cy="${cy}" r="40" class="wf-node-ring" fill="none" stroke="${n.color}" stroke-width="2"/>
          <circle cx="${n.x}" cy="${cy}" r="13" fill="${n.color}"/>
          <text x="${n.x}" y="${cy + 62}" text-anchor="middle" fill="#f0ede8" font-size="15" font-family="DM Sans,sans-serif" font-weight="600">${n.l1}</text>
          <text x="${n.x}" y="${cy + 80}" text-anchor="middle" fill="#888" font-size="13" font-family="DM Sans,sans-serif">${n.l2}</text>
        </g>`).join('')

      return `
        <div class="wf-layout" id="wf-layout" data-active="">

          <div class="wf-map-col">
            <div class="wf-map-title">Service Map</div>
            <div class="wf-map-hint">Click a service to open its workflow</div>
            <svg class="wf-svg" viewBox="0 0 920 190" xmlns="http://www.w3.org/2000/svg">
              <line x1="150" y1="${cy}" x2="770" y2="${cy}" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="5 4"/>
              <circle cx="305" cy="${cy}" r="4.5" fill="#555"/>
              <circle cx="615" cy="${cy}" r="4.5" fill="#555"/>
              ${nodeMarkup}
            </svg>
          </div>

          <div class="wf-detail-col">
            <div class="wf-empty-hint">
              <div class="wf-empty-icon">◉</div>
              <div class="wf-empty-text">Select a service above to see its stage-by-stage workflow</div>
            </div>
            ${detailPanels}
          </div>
        </div>`
    }

    function activateWorkflow(id) {
      const layout = document.getElementById('wf-layout')
      if (!layout) return
      layout.dataset.active = id
      const panel = layout.querySelector(`.wf-detail-panel[data-wf="${id}"]`)
      if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
    }

    window.setActiveWorkflow = activateWorkflow
    window.setWorkflowSection = function (btn, section) {
      const panel = btn.closest('.wf-detail-panel')
      if (!panel) return
      panel.dataset.section = section
      panel.querySelectorAll('.wfd-tab').forEach(t => t.classList.toggle('active', t === btn))
    }

    document.getElementById('wf-root').innerHTML = renderWorkflowMap()
  </script>
