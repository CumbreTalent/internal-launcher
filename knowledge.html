, invoicing and payment follow-up","tasks":["invoicing_ar"]}],"likelyTools":["QuickBooks Online","Google Workspace","Jobber, Buildertrend or Houzz Pro","Tradezip Quote Builder when quoting through Offload"]},{"id":"custom_builder","name":"Custom home builder","description":"Long builds with many selections, draws and vendors to keep track of.","typicalPlan":"full_time","firstHandoffs":[{"label":"Construction loan draw packages","tasks":["pay_apps","lien_waivers"]},{"label":"Selections and allowance tracking","tasks":["change_orders","accounts_payable"]},{"label":"Vendor and material orders","tasks":["material_orders","vendor_follow_up"]},{"label":"Client updates with site photos","tasks":["owner_updates","daily_logs"]}],"likelyTools":["QuickBooks Online","Buildertrend or CoConstruct","Lender draw portals","Google Workspace or Microsoft 365"]},{"id":"light_commercial","name":"Light commercial GC","description":"More formal paperwork: pay apps, submittals and compliance documents.","typicalPlan":"full_time","firstHandoffs":[{"label":"AIA G702/G703 pay applications","tasks":["pay_apps","retainage"]},{"label":"RFI and submittal logs","tasks":["rfis_submittals"]},{"label":"Sub COIs and prequalification","tasks":["coi_tracking","sub_onboarding","prequalification"]},{"label":"Bid invites and bid leveling","tasks":["invitations_to_bid","bid_leveling"]}],"likelyTools":["QuickBooks Online","Procore","Microsoft 365 and Excel","Bid platforms (BuildingConnected, PlanHub, iSqFt)","Owner or lender billing portals"]},{"id":"specialty","name":"Specialty contractor","description":"Electrical, plumbing, HVAC, concrete and other trades working under GCs.","typicalPlan":"part_time","firstHandoffs":[{"label":"Billing GCs and tracking retainage","tasks":["invoicing_ar","retainage"]},{"label":"COIs and compliance docs for GCs","tasks":["coi_tracking"]},{"label":"Crew and job scheduling","tasks":["sub_scheduling","calendar"]},{"label":"Quote and bid follow-up","tasks":["lead_follow_up","proposals"]}],"likelyTools":["QuickBooks Online","ServiceTitan or Jobber","Google Workspace","GC billing portals (Textura, GCPay)"]}],"trialTiming":{"days_4_7":"Trial days 4–7: first handoffs","week_2":"Trial week 2: bigger tasks, GC reviews each before it goes out","after_trial":"Days 15–90: rest of the plan, handed off at the day 30 review"},"serviceAreas":[{"id":"subs","code":"SV","name":"Subcontractors & vendors","short":"Subs & vendors","color":"#e8651a","tagline":"Your assistant confirms sub schedules and keeps insurance and paperwork current.","example":"The plumber's start date moves. Your assistant confirms the new date with the plumber and updates the drywall sub.","outcome":"Every sub shows up when scheduled with current insurance and paperwork, and every draw has its waivers.","planNote":"Part-Time covers sub scheduling and COI tracking. Full-Time covers all six tasks.","tasks":[{"id":"sub_scheduling","name":"Sub scheduling","plan":"part_time","trial":"days_4_7","what":"Confirm start dates and reschedule when the job moves.","cadence":"Day-before confirmations every working day; a two-week lookahead refreshed weekly","approval":"The VA confirms and reschedules within the limits the GC sets. Anything that moves the critical path goes to the GC first.","deliverables":["Day-before confirmation log","Two-week lookahead per job"],"training":["desk-day-to-day · Sub Confirmations & the Lookahead"]},{"id":"coi_tracking","name":"COI tracking","plan":"part_time","trial":"days_4_7","what":"Collect certificates and chase renewals before they lapse.","cadence":"Weekly expiry sweep; renewal requests at 30, 14 and 7 days before expiry; daily check on anyone starting tomorrow","approval":"The VA chases and flags. The GC decides whether a sub with a lapsed certificate works; the VA never waives a requirement. Whether coverage truly satisfies the contract (endorsement wording, exclusions) is the GC's risk judgment, not the VA's.","deliverables":["COI tracker: carrier, policy dates, expiry, renewal reminders","Block notice template"],"training":["desk-compliance · Reading & Verifying a COI","desk-compliance · Expirations, Blocking & Audit Readiness"]},{"id":"lien_waivers","name":"Lien waivers","plan":"full_time","trial":"week_2","what":"Collect conditional and unconditional waivers each draw.","cadence":"Monthly, tied to each draw: conditional before the pay app, unconditional after payment clears","approval":"The VA collects and matches every waiver to the pay app line. The GC releases sub payments.","deliverables":["Lien waiver log per job and draw","Waiver matrix matched to the pay app","Complete waiver package for each pay app, so the PM only reviews and submits"],"training":["desk-pay-app · Lien Waivers — Types, Sequencing & Matching","desk-pay-app · Preliminary Notices & Lien Risk"]},{"id":"sub_onboarding","name":"Sub onboarding","plan":"full_time","trial":"week_2","what":"W-9s, agreements and contact info, filed and current.","cadence":"Per new sub, then an annual refresh of W-9s, licenses and agreements","approval":"The GC signs sub agreements. The VA prepares, sends, chases and files. W-9s hold taxpayer IDs: they stay in the GC's own drive or accounting system, never in Offload tools, email or chat.","deliverables":["Compliance matrix (one row per sub)","Audit-ready sub file per trade partner","Vendor record set up in the GC's accounting system for the bookkeeper to approve, where the GC's QuickBooks access covers it"],"training":["desk-compliance · W-9s, Licenses, Agreements & Onboarding","desk-compliance · The Compliance Matrix"]},{"id":"material_orders","name":"Material orders","plan":"full_time","trial":"after_trial","what":"Place orders, confirm deliveries, track backorders.","cadence":"As jobs need; delivery confirmations in the day-before call","approval":"Orders under the amount the GC sets go out alone. Above it, the GC approves first.","deliverables":["Delivery and backorder tracker"],"training":["desk-day-to-day · Sub Confirmations & the Lookahead (deliveries and material orders)"]},{"id":"vendor_follow_up","name":"Vendor follow-up","plan":"full_time","trial":"after_trial","what":"Quotes, lead times and returns.","cadence":"As needed; open quotes chased every 2–3 days","approval":"The VA chases and compares. The GC picks the vendor.","deliverables":["Open quote and lead-time list"],"training":["desk-bid · Sub Coverage & Bid Leveling (clarifying a sub's number)"]}],"vaOnboarding":{"requiredModules":[{"module":"desk-compliance","title":"Sub Compliance","for":"both","why":"COIs, endorsements, W-9s, licenses and the compliance matrix are the core of this area"},{"module":"desk-day-to-day","title":"Day-to-Day Coverage","for":"both","why":"Day-before confirmations, the two-week lookahead, deliveries and material orders"},{"module":"desk-pay-app","title":"Pay App & Lien Waiver Desk","for":"full_time","why":"The lien waiver and preliminary notice sections, once waivers are in the plan"}],"brushUp":["Read an ACORD 25 and run the verification checklist on every certificate: insured name, the GC as certificate holder, additional-insured endorsement, limits, policy dates","The 30-day expiration rule and the block notice: you flag, you never waive","Workers' comp exemptions and ghost policies, and what to do when something doesn't match","Day-before confirmation script in English and Spanish, and what goes in the two-week lookahead","The four lien waiver types and the monthly sequence; match every waiver to the pay app before payment is released (Full-Time)","New sub onboarding sequence: W-9, license check, agreement, safety documents, filed in the audit file","Delivery and backorder tracking, and the GC's order limit","The terms inside a COI: additional insured needs an endorsement, certificate holder gives no rights, waiver of subrogation, primary and non-contributory","The lien waiver worked example: conditional with the pay app, unconditional after the check, finals at the end of the job"],"readiness":["Pass the Sub Compliance quiz and assignment in Crew Training","Pass the Day-to-Day Coverage quiz and assignment","Practical: verify three sample COIs and say which sub is blocked from starting and why","Practical: write a day-before confirmation text and a COI renewal request in the client's voice","Full-Time: build a waiver matrix for one sample draw from a pay app"],"firstWeekSetup":["Build the COI tracker from the GC's sub list: carrier, policy dates, expiry, renewal reminders","Collect W-9s, signed sub agreements and contact info for every active sub","Set up the lien waiver log per job and draw, conditional and unconditional (Full-Time)","Get supplier accounts and ordering methods; start delivery and backorder tracking (Full-Time)","Agree how you introduce yourself to subs and set up the email signature","Send the first day-before confirmations on day 4 and the first lookahead by the end of week 1"]},"clientOnboarding":{"techStack":[{"tool":"Company email on the GC's domain","need":"required","purpose":"Every sub and vendor message goes out under the company name"},{"tool":"Shared drive (Google Drive, OneDrive or Dropbox)","need":"required","purpose":"Sub files, COIs, W-9s, agreements, job schedules"},{"tool":"Spreadsheet (Google Sheets or Excel)","need":"required","purpose":"COI tracker, lookahead, waiver log and delivery tracker, unless the construction platform keeps them"},{"tool":"Construction platform (Buildertrend, Procore, CoConstruct)","need":"if_used","purpose":"Schedule, sub directory and document log live there instead of spreadsheets"},{"tool":"Phone line for subs","need":"required","purpose":"Confirmation calls and texts. Offload assigns the client a Quo number the VA works from; the GC can forward their line to it"},{"tool":"Supplier accounts (lumber yard, electrical and plumbing supply)","need":"if_used","purpose":"Placing and tracking material orders (Full-Time)"}],"access":[{"system":"Company email","level":"Own mailbox or delegate access","grantedBy":"GC","when":"Trial days 1–3"},{"system":"Job files / shared drive","level":"Edit on the jobs folder","grantedBy":"GC","when":"Trial days 1–3"},{"system":"Job schedules","level":"View; edit if the VA keeps the schedule","grantedBy":"GC","when":"Trial days 1–3"},{"system":"Construction platform","level":"User seat with schedule and documents","grantedBy":"GC","when":"Trial days 1–3, if used"},{"system":"Client's Quo number","level":"Member of the number","grantedBy":"Offload admin (Quo, then Refresh from Quo in the CRM)","when":"Before day 1"},{"system":"Supplier accounts","level":"Authorized to order up to the GC's limit","grantedBy":"GC","when":"When material orders are handed off"}],"inputs":["Sub and vendor list: trade, contact, active jobs","Current job schedules so start dates can be confirmed","The insurance requirements the GC holds subs to: limits, additional insured, workers' comp","Existing COIs, W-9s and sub agreements, wherever they live today","Supplier accounts and the ordering method for each (Full-Time)"],"decisions":["Which reschedules the VA can confirm alone, and which go to the GC first","The material order amount the VA can approve alone (Full-Time)","What happens when a sub's COI lapses: held off site, or the GC decides case by case","How the VA introduces themself to subs: title, signature, phone number"]},"primer":{"why":"Claims travel up the chain. If a sub's worker is injured or a sub damages the building, the GC and often the owner are pulled in, so the owner's contract requires the GC to prove every sub is insured. No valid COI generally means the sub should not be on site, and many GCs hold payment until one is on file. A lien waiver protects the owner from paying twice: a sub who is not paid can file a mechanic's lien on the property, so owners and lenders will not release payment without waivers from everyone on the job.","terms":["ACORD 25: the standard one-page certificate of insurance. A summary, not the policy.","Coverages a GC typically requires: general liability, workers' comp, commercial auto, umbrella or excess on larger jobs, professional liability only for design-build trades. Limits come from the contract.","Additional insured: the GC is added to the sub's policy. It needs an endorsement, not just a name typed on the form.","Certificate holder: who the certificate is issued to. It gives no rights under the policy.","Waiver of subrogation, and primary and non-contributory: often required by contract; check that each is ticked.","A certificate is only good until the earliest expiration date on it.","W-9: the IRS form with the sub's legal name and taxpayer ID, needed before anyone is paid because the GC reports sub payments at year end (1099s). A missing W-9 stops the payment, not the work.","Lien waiver types: conditional progress (signed with the pay app, valid only once paid), unconditional progress (after the check clears), conditional final and unconditional final.","Some states prescribe statutory waiver forms, Texas among them. Use the GC's forms, and never state a legal requirement to anyone."],"goesWrong":["Certificates arrive with missing wording, wrong limits or the wrong entity name, and the loop starts again","Policies expire mid-project, so the chase has to start about 30 days ahead","A sub signs the wrong waiver type, or for $48,000 when $50,000 is owed, or three days late, and the owner holds the GC's whole payment","Worked example: an electrician owed $50,000 for September signs a conditional progress waiver in early October; the GC bundles it with every other sub's waiver and its own pay app; the owner releases payment; the GC pays the electrician; the electrician signs an unconditional progress waiver, collected with the next cycle; final versions come at the end of the job"]}},{"id":"billing","code":"BM","name":"Billing & money","short":"Billing","color":"#5b8dee","tagline":"Your assistant handles billing paperwork and keeps QuickBooks current for your accountant.","example":"At month end, your assistant drafts the pay app from your schedule of values and sends it to you to review.","outcome":"Billed on time every draw, overdue invoices chased on a cadence, and QuickBooks current for the accountant.","planNote":"Part-Time covers invoicing and payment follow-up. Full-Time adds pay apps, change orders, bookkeeping and job costing.","tasks":[{"id":"pay_apps","name":"Pay apps","plan":"full_time","trial":"week_2","what":"Draft AIA G702/G703 or progress billing from the schedule of values, with sub pay apps and waivers gathered into one package.","cadence":"Monthly: cutoff, percent complete from the PM, draft, reconcile, GC approval, submit, follow up until it lands","approval":"The GC approves every pay app before it goes to the owner or lender. Percent complete comes from the PM, never the VA.","deliverables":["Monthly pay app package (G702/G703 or the owner's form) with waivers attached","Billing calendar per job","Payment tracker: billed, approved, received, outstanding"],"training":["desk-pay-app · The Schedule of Values","desk-pay-app · Reading & Building the G702/G703","desk-pay-app · Retainage, Cutoff & Follow-Up"]},{"id":"invoicing_ar","name":"Invoicing & AR","plan":"part_time","trial":"week_2","what":"Send invoices and follow up on overdue payments.","cadence":"Invoices on the agreed schedule; reminders at the agreed intervals; AR aging reviewed weekly","approval":"Chase as firmly as the GC agreed; hand off to the GC at the agreed age or on any dispute.","deliverables":["AR aging","Reminder sequence and payment follow-up log","Aging report kept current for the owner or controller"],"training":["day-3 · Invoicing, Draws & Payment Tracking","day-2 · Payment follow-up format and chasing payment script"]},{"id":"accounts_payable","name":"Accounts payable","plan":"full_time","trial":"after_trial","what":"Enter sub and supplier bills, prep payment runs.","cadence":"Bills entered as they arrive; payment run prepared on the GC's payment day","approval":"The GC approves bills and releases payment. The VA matches bills to POs and waivers and prepares the run.","deliverables":["Bill approval list for each payment run"],"training":["desk-day-to-day · QuickBooks Entry & Job Costing (sub invoices to POs)"]},{"id":"change_orders","name":"Change orders","plan":"full_time","trial":"after_trial","what":"Write up, request and collect sub pricing, send for signature, track approvals, and make sure every approved change reaches the next pay app.","cadence":"As changes come up; log reviewed weekly so nothing is built before it is signed","approval":"The GC prices and approves every change order. The VA writes it up, sends it for signature, tracks it and adds it to the SOV once signed.","deliverables":["Change order log","Signed change orders filed per job"],"training":["desk-pc · Change Orders — Signed Before Built","desk-pay-app · Change orders on the SOV"]},{"id":"quickbooks","name":"QuickBooks","plan":"full_time","trial":"after_trial","what":"Bookkeeping, job costing and reconciliation. Where the GC also runs project software, keep contract values and change orders matching in both and enter each sub invoice once.","cadence":"Receipts and bills coded weekly; reconciliation on the agreed schedule; weekly reports to the GC","approval":"The VA's role is entry and coding; the bookkeeper or accountant owns the books. Nothing is deleted or reclassified without the GC.","deliverables":["Job cost coding on every transaction","Weekly AR, AP and job cost reports"],"training":["day-4 · QuickBooks Online","desk-day-to-day · QuickBooks Entry & Job Costing"]},{"id":"retainage","name":"Retainage","plan":"full_time","trial":"after_trial","what":"Track what's held and what's due back, both ways: held by the owner from the GC, and held by the GC from each sub.","cadence":"Updated every draw; release requested at closeout","approval":"The VA tracks and requests release; the GC confirms the amounts.","deliverables":["Retainage tracker per job: held and due back"],"training":["desk-pay-app · Retainage, Cutoff & Follow-Up","desk-pc · Final pay app and retainage release"]}],"vaOnboarding":{"requiredModules":[{"module":"day-3","title":"Construction Deep Dive (invoicing, draws and payment tracking)","for":"both","why":"Invoice components, draw schedules and chasing payments"},{"module":"day-4","title":"Tools & Systems (QuickBooks Online)","for":"both","why":"Creating invoices, recording payments, the reports to run weekly"},{"module":"desk-pay-app","title":"Pay App & Lien Waiver Desk","for":"full_time","why":"SOV, G702/G703, waivers, prelims, retainage and the monthly cadence"},{"module":"desk-pc","title":"Project Coordinator (change orders)","for":"full_time","why":"The change order lifecycle and log"},{"module":"desk-day-to-day","title":"Day-to-Day Coverage (QuickBooks entry and job costing)","for":"full_time","why":"Receipt capture, job cost coding, sub invoices to POs, reconciliation support"}],"brushUp":["Invoice components, payment terms and the chasing payment script and voicemail template","QuickBooks Online: create an invoice, record a payment, run the weekly AR aging and job cost reports","Build the SOV from the contract; know front-loading and why you never do it (Full-Time)","The G703 continuation sheet and G702 cover sheet; do the worked example until the math is automatic (Full-Time)","Stored materials, and reconciling the draft before it goes to the GC (Full-Time)","Change order lifecycle: signed before built, what every change order includes, the log (Full-Time)","Receipt capture and job cost coding; your role versus the bookkeeper's (Full-Time)","Retainage: what is held, when it is due back, and the billing portals owners and lenders use (Full-Time)","The two layers of billing: sub pay apps roll up into the GC's pay app, and retainage is tracked both ways","Why an unbilled change order is lost margin, and how to check that every approved change reached the pay app"],"readiness":["Pass the Day 3 and Day 4 quizzes and assignments","Full-Time: pass the Pay App & Lien Waiver Desk quiz and assignment","Practical: draft payment reminders at the agreed intervals and the hand-off note to the GC","Practical (Full-Time): build a G702/G703 from a sample SOV with retainage and one change order, and reconcile it","Practical (Full-Time): code ten sample receipts to jobs and classes"],"firstWeekSetup":["Load invoice templates, payment terms and the current AR aging; start the reminder sequence","Pay apps: get the schedule of values per job, the billing format and each billing date; build the billing calendar (Full-Time)","Custom builders: get each lender's draw package requirements (Full-Time)","Accounts payable: agree the bill approval flow and payment run day (Full-Time)","Change orders: get the template and signature tool; start the approval log (Full-Time)","QuickBooks: confirm the jobs or classes used for job costing and the reconciliation schedule (Full-Time)","Start a retainage tracker per job: held and due back (Full-Time)"]},"clientOnboarding":{"techStack":[{"tool":"QuickBooks Online (or Desktop)","need":"required","purpose":"Invoicing, AR, AP, job costing, reconciliation"},{"tool":"Spreadsheet (Google Sheets or Excel)","need":"required","purpose":"SOV, billing calendar, retainage tracker, change order log"},{"tool":"Pay app format","need":"if_used","purpose":"AIA G702/G703 (AIA Contract Documents or Excel), the owner's form, or the platform's billing module (Procore, Buildertrend)"},{"tool":"Owner or lender billing portals (Textura, GCPay, lender draw portals)","need":"if_used","purpose":"Submitting pay apps and draw packages"},{"tool":"E-signature (DocuSign, PandaDoc, Adobe Sign, or the platform's)","need":"if_used","purpose":"Change orders and sub agreements"},{"tool":"Payment collection (QuickBooks Payments, ACH, checks)","need":"required","purpose":"Knowing when money landed so reminders stop"},{"tool":"Company email","need":"required","purpose":"Invoices, reminders and pay app submissions go out under the company name"}],"access":[{"system":"QuickBooks","level":"A user limited to the plan's tasks: AR and AP, no payroll, no bank feeds unless the GC chooses","grantedBy":"GC","when":"Trial week 2 for invoicing; widened at day 30 for AP and job costing"},{"system":"Owner or lender billing portals","level":"Submitter login, or the GC submits what the VA prepares","grantedBy":"GC","when":"Before the first pay app"},{"system":"E-signature account","level":"Sender seat; the GC remains the signer","grantedBy":"GC","when":"When change orders are handed off"},{"system":"Bank","level":"None. At most read-only statements for reconciliation, and only if the GC chooses","grantedBy":"GC","when":"Never by default"},{"system":"Accountant or bookkeeper","level":"Introduction and agreed division of work","grantedBy":"GC","when":"Before QuickBooks work starts"}],"inputs":["Invoice templates, payment terms and the current AR aging","Schedule of values per job, the billing format and each billing date (Full-Time)","Each lender's draw package requirements (custom builders)","The bill approval flow and payment run day (Full-Time)","Change order template and the signature tool (Full-Time)","QuickBooks jobs or classes used for job costing, and the reconciliation schedule (Full-Time)","Retainage terms per contract (Full-Time)"],"decisions":["Every pay app goes through the GC before it reaches the owner or lender","How firmly to chase overdue invoices, and the age at which the GC takes over","Who talks to the accountant or bookkeeper, and what the VA may change in QuickBooks","The bill amount the VA can enter and schedule without a second look","Change orders: who prices them, who signs, and whether work may start before signature"]},"primer":{"why":"GCs are paid monthly for the percentage of work complete, not when the building is done, and the pay application is that monthly package. The GC bills the owner, and every sub bills the GC with its own pay app, so the GC rolls sub pay apps up and pays subs after it is paid. Retainage, commonly 5 to 10 percent but set by contract, is held back both ways until the job is complete. If a pay app is late or rejected, or a waiver is missing, the GC's cash slips while payroll and materials still come due, and subs get paid late.","terms":["Schedule of values: the line-item breakdown of the contract price, agreed with the owner at the start. The skeleton of every pay app.","Percent complete per line: the PM's or superintendent's judgment of what is built. Never the VA's.","Stored materials: bought but not yet installed, sometimes billable with documentation.","Approved change orders are added to the contract and the SOV so they can be billed.","Backup: sub pay apps, lien waivers, and sometimes invoices and certified payroll, attached to support the numbers.","G702 is the summary cover sheet; G703 is the continuation sheet with the line items.","Pay-when-paid and pay-if-paid clauses tie a sub's payment to the owner paying the GC. Enforceability varies by state and wording, so never explain their legal effect."],"goesWrong":["The monthly crunch: numbers, backup and waivers all gathered at the deadline","An Excel pay app with a broken formula or an out-of-date SOV, caught by the owner's side and returned, so payment slides by weeks","Retainage running totals per line and per sub drift out of sync","An approved change order never reaches the pay app and is never billed: lost margin for a business running at 5 to 15 percent","Unpaid owner invoices pile up because nobody is assigned to follow up consistently"]}},{"id":"projects","code":"PC","name":"Project coordination","short":"Projects","color":"#4caf7d","tagline":"Your assistant tracks permits, inspections and job documents, and keeps owners updated.","example":"An inspection passes. Your assistant logs the result, files the photos and updates the owner.","outcome":"No permit or inspection slips, the RFI and submittal logs are current, and owners hear from the office every week.","planNote":"Part-Time covers permits and inspections. Full-Time adds RFIs, submittals, owner updates, daily logs and closeout.","tasks":[{"id":"permits","name":"Permits","plan":"part_time","trial":"week_2","what":"Applications, follow-ups and hold times with the city.","cadence":"Status checked on every open permit weekly; resubmittals the day comments arrive","approval":"The GC or license holder signs applications. The VA prepares, submits where allowed, tracks and chases.","deliverables":["Open permit list per job with the portal and status"],"training":["desk-day-to-day · Permits & Inspections","day-3 · Permits, Inspections & Compliance"]},{"id":"inspections","name":"Inspections","plan":"part_time","trial":"week_2","what":"Schedule, confirm and log results.","cadence":"Booked as the schedule calls for them; confirmed the day before; result logged the same day","approval":"The VA books within the schedule the GC shares; the PM confirms the work is ready.","deliverables":["Inspection results log per job"],"training":["desk-day-to-day · Permits & Inspections (inspection scheduling)"]},{"id":"rfis_submittals","name":"RFIs & submittals","plan":"full_time","trial":"after_trial","what":"Keep the logs current and chase responses.","cadence":"Logs updated as items move; overdue responses chased every 2–3 days; agree the volume with the GC, since a job can run to hundreds of submittals","approval":"The PM writes the RFI question and reviews submittals. The VA logs, sends, chases and files. Check each submittal package for completeness against the spec list before routing it.","deliverables":["RFI log","Submittal log with statuses and due dates"],"training":["desk-pc · RFIs & Submittals"]},{"id":"owner_updates","name":"Owner updates","plan":"full_time","trial":"week_2","what":"Weekly progress reports with photos.","cadence":"Weekly on the agreed day","approval":"The GC chooses: approve each update first, or let it go out in the agreed format.","deliverables":["Weekly owner update per job in the agreed format"],"training":["day-2 · Status update format","desk-pc · Daily Logs, Meeting Minutes & the Document Set"]},{"id":"daily_logs","name":"Daily logs","plan":"full_time","trial":"after_trial","what":"Turn the PM's notes, voice memos or texts into a clean daily log in the GC's format; organize site photos by date, area and trade.","cadence":"Compiled daily from the field","approval":"The field sends; the VA compiles and files. Nothing is invented for a day with no notes.","deliverables":["Daily log per job","Photo folder per job"],"training":["desk-pc · Daily Logs, Meeting Minutes & the Document Set"]},{"id":"punch_closeout","name":"Punch & closeout","plan":"full_time","trial":"after_trial","what":"Punch lists, warranties, O&Ms and final docs.","cadence":"From substantial completion to final payment","approval":"The PM walks the punch list; the VA tracks it and collects closeout documents from subs.","deliverables":["Punch list tracker","Closeout binder: warranties, O&Ms, final documents, final waivers"],"training":["desk-pc · Punch List & Closeout"]}],"vaOnboarding":{"requiredModules":[{"module":"day-3","title":"Construction Deep Dive (project lifecycle, permits)","for":"both","why":"How permits work and the VA's permit responsibilities"},{"module":"desk-day-to-day","title":"Day-to-Day Coverage (permits and inspections)","for":"both","why":"Permit portals, status checks, resubmittals, inspection scheduling"},{"module":"day-2","title":"English Communication (status updates)","for":"both","why":"The owner update format"},{"module":"desk-pc","title":"Project Coordinator","for":"full_time","why":"RFIs, submittals, daily logs, meeting minutes, punch list and closeout"}],"brushUp":["How permits work in the client's jurisdictions, and where resubmittals and hold times come from","Booking inspections, the day-before confirmation and logging the result the same day","The status update format and writing in the owner's voice","RFIs: formal questions, the log, chasing; submittals: statuses and approval before install (Full-Time)","What goes in a daily log and how to compile it from the field (Full-Time)","The closeout binder and collecting closeout documents from subs (Full-Time)","RFI, submittal and change order: who each is between and the question it answers","Checking a submittal package for completeness against the spec list before it is routed"],"readiness":["Pass the Day 2 and Day 3 quizzes and assignments","Full-Time: pass the Project Coordinator quiz and assignment","Practical: write a weekly owner update from a set of site photos and field notes","Practical: log a sample set of permits with their portals and next action","Practical (Full-Time): log three RFIs and two submittals and write the chase email"],"firstWeekSetup":["List open permits per job and the city portals they sit in","Record how inspections are booked in each jurisdiction; start the results log","Owner updates: agree format, day of the week, photo source and who approves","Set where field notes and site photos land, and make a folder per job","Set up RFI and submittal logs with design-team contacts and due dates (Full-Time)","Set up punch list and closeout tracking: warranties, O&Ms, final documents (Full-Time)"]},"clientOnboarding":{"techStack":[{"tool":"City or county permit portals","need":"required","purpose":"Applications, status, resubmittals and inspection booking, one portal per jurisdiction"},{"tool":"Shared drive and photo source (phone photos, CompanyCam, the platform's photo log)","need":"required","purpose":"Daily logs, site photos and owner updates"},{"tool":"Construction platform (Procore, Buildertrend, CoConstruct)","need":"if_used","purpose":"RFI, submittal, daily log and owner portal modules"},{"tool":"Calendar","need":"required","purpose":"Inspections, site visits and owner meetings"},{"tool":"Company email","need":"required","purpose":"Owner updates, RFI and submittal correspondence under the company name"},{"tool":"Spreadsheet","need":"required","purpose":"Permit list, inspection log, RFI and submittal logs when there is no platform"}],"access":[{"system":"Permit portals","level":"Authorized agent or delegate on the GC's license account; some jurisdictions require the license holder to submit, in which case the VA prepares and tracks","grantedBy":"GC","when":"Trial week 2"},{"system":"Construction platform","level":"User seat with RFI, submittal and daily log modules","grantedBy":"GC","when":"Trial days 1–3, if used"},{"system":"Calendar","level":"Edit","grantedBy":"GC","when":"Trial days 1–3"},{"system":"Job files / shared drive","level":"Edit on the jobs folder","grantedBy":"GC","when":"Trial days 1–3"},{"system":"Owner and design-team contacts","level":"Contact list and an introduction from the GC","grantedBy":"GC","when":"Before the first owner update"}],"inputs":["Open permits per job and the portal each sits in","How inspections are booked in each jurisdiction and who confirms the work is ready","Owner update format, day of the week and photo source","Design-team contacts and submittal due dates (Full-Time)","Where field notes and site photos land today","Closeout requirements per contract: warranties, O&Ms, final documents (Full-Time)"],"decisions":["Whether the GC approves each owner update before it goes out, or only sets the format","What the VA may tell an owner directly, and what goes through the GC","Who confirms a job is ready before an inspection is booked","What goes in the daily log and who is responsible for sending field notes"]},"primer":{"why":"RFIs, submittals and change orders are formal written processes because informal agreements on site are how disputes and unpaid work happen. Daily logs and photos are the evidence months later in a delay claim, a dispute over extra work or an insurance claim.","terms":["RFI: GC to architect. 'Your plans are unclear, what do you mean?' Logged with a number and date and tracked until answered.","Submittal: GC to architect. 'Here is the exact product I plan to use, do you approve?' Approved, approved with comments, or rejected. A project can have hundreds, each with a review window and long-lead items.","Change order: GC and owner. 'We are changing the deal, here is the new price and schedule.' Work should not proceed on a change without written approval.","Daily log: weather, who was on site, what work happened, deliveries, visitors, delays and safety events.","Permits and inspections vary by jurisdiction. Ask how each city or county works rather than assume."],"goesWrong":["Unanswered RFIs hold up work, and the log's dates decide delay claims","A late or rejected submittal delays the schedule by weeks","Change logs fall behind, and approved changes are missed on the next pay app","PMs write logs late or from memory; photos sit unsorted on phones and personal cloud accounts with no names or dates"]}},{"id":"bids","code":"BE","name":"Bids & estimating support","short":"Bids","color":"#f0b429","tagline":"Your assistant handles the admin side of bidding so you can focus on the numbers.","example":"A bid is due in ten days. Your assistant sends plans to 12 subs, follows up, and lines up the quotes in one sheet.","outcome":"Every bid has full sub coverage, levelled numbers and a complete package on bid day. The GC sets the price.","planNote":"Full-Time only. Not included in Part-Time.","tasks":[{"id":"bid_calendar","name":"Bid calendar","plan":"full_time","trial":"after_trial","what":"Track invites, walkthroughs and due dates.","cadence":"Updated as invitations arrive; reviewed with the GC weekly for go/no-go","approval":"Go/no-go is the GC's call. The VA prepares the summary.","deliverables":["Bid log with go/no-go summaries","Pre-bid meeting dates on the calendar"],"training":["desk-bid · Bid Calendar & Go/No-Go Prep"]},{"id":"invitations_to_bid","name":"Invitations to bid","plan":"full_time","trial":"after_trial","what":"Send plans to subs and follow up for numbers.","cadence":"Invites out the day the bid is a go; coverage chased on the desk's cadence until bid day","approval":"The GC approves the sub list by trade. The VA sends, chases and tracks coverage.","deliverables":["Coverage tracker per bid, by trade"],"training":["desk-bid · Sub Coverage & Bid Leveling","desk-bid · Plans, Specs & Addenda"]},{"id":"bid_leveling","name":"Bid leveling","plan":"full_time","trial":"after_trial","what":"Line up sub quotes side by side for easy comparison.","cadence":"As numbers come in; final leveling the day before bid day","approval":"The VA levels scope and flags gaps and plugs. The GC chooses the number.","deliverables":["Leveling sheet per trade"],"training":["desk-bid · Sub Coverage & Bid Leveling (leveling, clarifying, plugs and gaps)"]},{"id":"vendor_pricing","name":"Vendor pricing","plan":"full_time","trial":"after_trial","what":"Get current material pricing and lead times.","cadence":"Per bid; standing price lists refreshed on the GC's schedule","approval":"The VA collects. The GC applies markup and chooses.","deliverables":["Material pricing and lead-time sheet"],"training":["desk-quote · Pricing: Subs, Materials, Labor & Markup"]},{"id":"proposals","name":"Proposals","plan":"full_time","trial":"after_trial","what":"Format and send your proposals and qualifications.","cadence":"Per bid or quote; follow-up sequence after sending","approval":"The GC approves every number and signs. The VA formats, sends and follows up.","deliverables":["Proposal in the GC's template","Follow-up log"],"training":["desk-quote · Sending, Follow-Up & Reporting","desk-bid · The Bid Package, Prequal & Win/Loss"]},{"id":"prequalification","name":"Prequalification","plan":"full_time","trial":"after_trial","what":"Fill out owner and GC prequal forms.","cadence":"As requested; the prequal pack refreshed when insurance or licenses renew","approval":"The VA fills from the prequal pack. Financial statements and signatures stay with the GC.","deliverables":["Prequal pack kept current: insurance, licenses, references, project list"],"training":["desk-bid · The Bid Package, Prequal & Win/Loss (prequalification packages)"]}],"vaOnboarding":{"requiredModules":[{"module":"desk-bid","title":"Bid Desk (Commercial)","for":"full_time","why":"Bid calendar, plans and addenda, takeoff fundamentals, coverage, leveling, the bid package and prequal"},{"module":"desk-quote","title":"Quote Desk (Residential)","for":"full_time","why":"For residential clients: the 48-hour clock, scope writing, pricing inputs, sending and follow-up"},{"module":"quotes","title":"Generating Quotes","for":"full_time","why":"Anatomy of a construction quote and follow-up tracking"},{"module":"quote-builder-app","title":"The Quote Builder App","for":"full_time","why":"Only when the client quotes through Tradezip"}],"brushUp":["Where invitations come from, the bid log and the go/no-go summary","Organizing plans, specs and addenda; bid-phase RFIs; alternates and unit prices","Takeoff fundamentals: set the scale on every sheet, organize by trade and area, self-check","Invitations to bid, the coverage tracker and chase cadence","Leveling apples to apples, clarifying a sub's number, plugs and gaps","The bid package checklist and bid-day roles; the win/loss log","Markup versus margin, and the pre-send accuracy check","Residential: the 48-hour clock from site visit to proposal, and writing scope a homeowner can read","Coverage gaps and post-bid follow-up: who is bidding, and what was won, lost or pending"],"readiness":["Pass the Bid Desk quiz and assignment","Residential clients: pass the Quote Desk quiz and assignment","Practical: build a coverage tracker and leveling sheet for one trade from three sample sub quotes","Practical: assemble a bid package checklist from a sample invitation and spec book","Clients on Tradezip: complete the Quote Builder deep dive and submit a test quote for approval"],"firstWeekSetup":["Set up the bid calendar: invites, walkthroughs, due dates","Get the sub bid list by trade and how plans are shared","Build the bid leveling template","Get the proposal and qualifications template","Load the prequalification pack: insurance, licenses, references, project list"]},"clientOnboarding":{"techStack":[{"tool":"Bid platforms and plan rooms (BuildingConnected, PlanHub, iSqFt, Dodge, agency portals)","need":"if_used","purpose":"Where invitations arrive and plans are shared"},{"tool":"Plan sharing (shared drive or plan room link)","need":"required","purpose":"Sending plans and addenda to subs"},{"tool":"Takeoff tool (Bluebeam, PlanSwift, STACK)","need":"if_used","purpose":"Quantities, when the GC wants takeoff support"},{"tool":"Spreadsheet","need":"required","purpose":"Bid log, coverage tracker, leveling sheet, pricing sheet"},{"tool":"Proposal template (Word, Docs or Tradezip Quote Builder)","need":"required","purpose":"Proposals in the GC's format"},{"tool":"E-signature","need":"if_used","purpose":"Proposal acceptance"},{"tool":"Company email","need":"required","purpose":"Invitations, chases and proposals under the company name"}],"access":[{"system":"Bid platforms","level":"User seat on the GC's company account","grantedBy":"GC","when":"When bids are handed off"},{"system":"Plan files","level":"Edit on the bids folder","grantedBy":"GC","when":"When bids are handed off"},{"system":"Proposal template and pricing inputs","level":"Template, unit rates and markup rules as the GC chooses to share","grantedBy":"GC","when":"When bids are handed off"},{"system":"Prequalification pack","level":"Insurance, licenses, references; financial statements stay with the GC","grantedBy":"GC","when":"When bids are handed off"},{"system":"Tradezip Quote Builder","level":"Assistant login under the client's tenant","grantedBy":"Offload admin","when":"If the client quotes through Tradezip"}],"inputs":["Sub bid list by trade, and how plans are shared with them","Where invitations to bid come from today","Proposal and qualifications template","Prequalification pack: insurance, licenses, references, project list","Unit rates, labor rates and markup rules the GC is willing to share, or who to ask"],"decisions":["Go/no-go is the GC's; the VA prepares the summary","The VA never sets a price or sends a number the GC hasn't approved","Who signs bid forms and proposals, and bid-day roles","Which trades the VA may clarify directly with subs, and what goes to the estimator"]},"primer":{"why":"To win work the GC prices the project from sub quotes plus its own costs and overhead. The VA handles the logistics around the number so the estimator can spend bid week pricing.","terms":["Invitation to bid (ITB): plans and scope sent to a list of subs for each trade, with confirmation that they received them.","Takeoff: quantities measured from the plans, usually by estimators or subs.","Coverage: how many quotes each trade has. One or none close to bid day is a scramble.","Leveling: comparing quotes apples to apples. A low number may leave out what another included.","Prequalification: owner and GC forms proving insurance, licenses, references and financials. Financials stay with the GC."],"goesWrong":["Dozens of subs invited, many never reply, and the GC cannot tell who is bidding","Quotes arrive in different formats close to the deadline","Proposal formatting eats estimator time meant for pricing","Post-bid silence: nobody follows up, and won, lost and pending are not tracked"]}},{"id":"office","code":"OP","name":"Office & phones","short":"Office","color":"#9b6fd4","tagline":"Your assistant answers calls, follows up on leads and manages your inbox.","example":"A new lead calls while you're on site. Your assistant calls back the same day and books your walkthrough.","outcome":"Every call answered or returned the same day, every lead booked, the inbox and calendar handled, and the GC gets one end-of-day summary.","planNote":"Part-Time covers phones, email and calendar. Full-Time adds document filing and recurring admin.","tasks":[{"id":"phone_coverage","name":"Phone coverage","plan":"part_time","trial":"days_4_7","what":"Answer calls, take messages, route what's urgent.","cadence":"Live during coverage hours; missed calls and voicemails returned the same day","approval":"The GC defines what counts as urgent and how it is routed. The VA answers in the agreed greeting.","deliverables":["Call log and messages in the end-of-day summary"],"training":["day-2 · Phone & Verbal Communication","desk-day-to-day · Leads, Reviews & the Owner's Inbox"]},{"id":"lead_follow_up","name":"Lead follow-up","plan":"part_time","trial":"days_4_7","what":"Call back new inquiries and book estimates.","cadence":"Same-day callback; follow-up sequence until booked or closed","approval":"The VA qualifies with the GC's intake questions and books within the GC's availability. The GC quotes.","deliverables":["Lead list with status","Booked estimates on the calendar"],"training":["lead-gen · Handling Inbound Leads","desk-day-to-day · Inbound lead response"]},{"id":"inbox","name":"Inbox management","plan":"part_time","trial":"days_4_7","what":"Sort, reply and flag what needs you.","cadence":"Worked through the day; inbox zero or flagged by end of day","approval":"The GC sets what the VA answers alone and what is flagged. Labels or folders as agreed.","deliverables":["Flagged items in the end-of-day summary"],"training":["day-4 · Google Workspace (Gmail labels and filters)","day-2 · Written Communication Standards"]},{"id":"calendar","name":"Calendar","plan":"part_time","trial":"days_4_7","what":"Keep your site visits and meetings organized.","cadence":"Daily; tomorrow confirmed in the end-of-day summary","approval":"The VA books within the GC's rules for site visits and meetings.","deliverables":["Tomorrow's schedule in the end-of-day summary"],"training":["day-4 · Sheets & Calendar","desk-day-to-day · Email and calendar management"]},{"id":"document_filing","name":"Document filing","plan":"full_time","trial":"week_2","what":"Contracts, plans and photos where you can find them.","cadence":"Daily as documents arrive","approval":"Filed in the structure agreed at kickoff; nothing is deleted.","deliverables":["Folder structure per job, kept current"],"training":["day-4 · Google Drive: file naming","day-4 · File Management & Security"]},{"id":"other_admin","name":"Other admin","plan":"full_time","trial":"after_trial","what":"Recurring tasks you'd rather not do yourself: onboarding paperwork, certifications, timesheets, reviews.","cadence":"On the GC's recurring list","approval":"Each recurring task is written down with its owner and cadence at day 30.","deliverables":["Recurring admin list with cadence"],"training":["desk-day-to-day · HR Admin","desk-day-to-day · Proposal follow-up and review requests"]}],"vaOnboarding":{"requiredModules":[{"module":"day-2","title":"English Communication","for":"both","why":"Written standards, email structure, phone and verbal communication, construction scripts"},{"module":"day-4","title":"Tools & Systems","for":"both","why":"Gmail labels and filters, Drive naming, Sheets and Calendar, security"},{"module":"day-5","title":"Client Management","for":"both","why":"First-week questions, the end-of-day report, difficult situations, limits"},{"module":"desk-day-to-day","title":"Day-to-Day Coverage","for":"both","why":"Inbound lead response, the owner's inbox, document filing, HR admin"},{"module":"lead-gen","title":"Lead Generation","for":"both","why":"What a qualified lead looks like and handling inbound leads"}],"brushUp":["Answering and opening a call, clarity on calls, and what to say when you don't know","The subject line formula, the status update format and the filler phrases to eliminate","Inbound lead response: the GC's intake questions, estimate booking rules and availability","Gmail labels and filters, and the inbox rules agreed with the GC","Calendar rules for site visits and meetings","Drive file naming and the filing structure for contracts, plans and photos","The end-of-day report: do it every day","Password and credential security and the data security hard limits","Where a GC's systems overlap, and where the same thing gets typed twice"],"readiness":["Pass the Day 2, Day 4 and Day 5 quizzes and assignments; Day 5 certification","Pass the Day-to-Day Coverage quiz and assignment","Practical: take a mock inbound lead call, qualify it and book the estimate","Practical: triage a sample inbox of 15 messages into answer, flag and file, and write the end-of-day summary"],"firstWeekSetup":["Write the call greeting; define what counts as urgent and how to route it","Lead intake: the questions to ask, estimate booking rules, GC availability","Inbox rules: what to answer, what to flag, the folder or label structure","Calendar rules for site visits and meetings","Set the filing structure for contracts, plans and photos","List the GC's recurring admin tasks","Send the first end-of-day summary on day 4"]},"clientOnboarding":{"techStack":[{"tool":"Phone line","need":"required","purpose":"Offload assigns the client a Quo number (CRM → Settings → Lines) that the VA answers and texts from; the GC forwards the main line to it or publishes it. Or a seat on the GC's own system (RingCentral, Google Voice)"},{"tool":"Company email (Google Workspace or Microsoft 365)","need":"required","purpose":"A mailbox on the GC's domain, or delegate access to the GC's"},{"tool":"Calendar (Google or Outlook)","need":"required","purpose":"Site visits, estimates and meetings"},{"tool":"Shared drive","need":"required","purpose":"Contracts, plans and photos"},{"tool":"The GC's CRM or lead tool (Jobber, Buildertrend leads, HubSpot)","need":"if_used","purpose":"Lead status, if the GC has one. Texts and calls on the client's Quo line are already in the Offload CRM"},{"tool":"Password manager","need":"required","purpose":"Sharing any login without sending passwords in email or text"}],"access":[{"system":"Company email","level":"Own mailbox on the GC's domain, or delegate access","grantedBy":"GC","when":"Trial days 1–3"},{"system":"Client's Quo number","level":"Member of the number; the GC sets forwarding or coverage hours","grantedBy":"Offload admin and GC","when":"Before day 1"},{"system":"Calendar","level":"Edit","grantedBy":"GC","when":"Trial days 1–3"},{"system":"Shared drive","level":"Edit on the jobs folder","grantedBy":"GC","when":"Trial days 1–3"},{"system":"GC's CRM or lead tool","level":"User seat","grantedBy":"GC","when":"Trial days 1–3, if used"},{"system":"Shared logins","level":"Shared through the password manager only","grantedBy":"GC","when":"As each tool is handed off"}],"inputs":["The call greeting, what counts as urgent and how to route it","Lead intake questions, estimate booking rules and the GC's availability","Inbox rules: what to answer, what to flag, the folder or label structure","Calendar rules for site visits and meetings","The filing structure for contracts, plans and photos, or permission to set one","The GC's list of recurring admin tasks (Full-Time)","Contact lists: subs, vendors, owners, inspectors"],"decisions":["What the VA may answer alone, and what is flagged to the GC","Who may be given the GC's cell number, and how urgent items reach the GC","Coverage hours, time-zone overlap and what happens to calls outside them","The end-of-day summary format and channel, and the weekly check-in time"]},"primer":{"why":"The owner is usually head of sales and head firefighter at the same time, so the inbox, calendar and follow-ups slip first. GCs also run several disconnected tools, and the same information gets typed twice.","terms":["Project management software (Procore, Buildertrend): RFIs, submittals, schedules, daily logs, drawings.","Accounting (QuickBooks, Sage): job costing, AP and AR, payroll, invoices.","Spreadsheets: pay apps, bid leveling, trackers. Flexible and fragile.","Email and drive: where everything else lives, and where things get lost."],"goesWrong":["A sub invoice entered in the project system and again in accounting","Contract values and change orders updated in one place but not the other, so reports disagree","Month-end close slows while someone reconciles what each system shows","A new lead calls while the owner is on site and is never called back"]}}],"vaFoundation":{"intro":"Every assistant goes through the same foundation before a client ever meets them. The service desks are added on top, by what the client's plan needs.","vetting":["Construction background: knows what a COI, a pay app and a change order are before day one","English fluency: comfortable on the phone with subs, suppliers and owners","Software: QuickBooks, Google Workspace, Microsoft 365, Excel; a plus for Buildertrend, Procore, CoConstruct, Jobber or ServiceTitan","Reliability: dedicated to one company, working its hours, with the home setup Day 4 requires"],"trainingPath":[{"stage":"Foundation week in Crew Training","gate":"Quiz and assignment each day; certification on Day 5","items":["Day 1 · Foundation: what Offload does, the VA's role, the construction client profile, professional standards","Day 2 · English Communication: written standards, email structure and drills, phone and verbal, construction language and scripts","Day 3 · Construction Deep Dive: the trades, project lifecycle, permits and compliance, invoicing and draws","Day 4 · Tools & Systems: Google Workspace, QuickBooks Online, field service tools, file management and security","Day 5 · Client Management: the first week with a client, difficult situations, limits, long-term excellence"]},{"stage":"Day-to-Day Coverage desk","gate":"Quiz and assignment","items":["Included with every placement: sub confirmations and the lookahead, permits and inspections, leads and the owner's inbox, QuickBooks entry, HR admin"]},{"stage":"Service desks for the client's plan","gate":"The desks b function persist() { try { localStorage.setItem('okc', JSON.stringify({ plan: state.plan, ctype: state.ctype, subtab: state.subtab })); } catch {} }

/* ── Crew Training deep links ──
   A training reference is '<module id> · <section or item heading>'. The academy
   opens #module/<id>/<slug> for deep dives and desks and #day/<n>/<slug> for the
   foundation days; slug = heading lowercased, non-alphanumerics to '-', trimmed.
   A trailing parenthetical ("… (QuickBooks Online)") is a note, not a heading. */
let trainingUrl = 'https://offload-crew-training.vercel.app'; // replaced by the Crew Training tile address from /api/apps
const slugify = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
function academyHash(ref) {
  const i = ref.indexOf(' · ');
  const mod = (i < 0 ? ref : ref.slice(0, i)).trim();
  const heading = i < 0 ? '' : ref.slice(i + 3).replace(/\s*\([^()]*\)\s*$/, '').trim();
  const day = /^day-(\d+)$/.exec(mod);
  const base = day ? '#day/' + day[1] : '#module/' + slugify(mod);
  const slug = slugify(heading);
  return slug ? base + '/' + slug : base;
}
function trainingChip(ref, label) {
  const hash = academyHash(ref);
  let href; try { href = new URL(hash, trainingUrl).href; } catch { href = trainingUrl + hash; }
  return `<a class="chip academy" href="${esc(href)}" data-academy="${esc(hash)}" target="_blank" rel="noopener" title="Open in Crew Training">${label}</a>`;
}
// Inside the launcher, ask it to open the Crew Training tile (signed in) at the
// hash; on its own, the chip is a plain link to the academy in a new tab.
function openAcademy(hash) {
  window.parent.postMessage({ type: 'offload:open-app', key: 'training', hash }, location.origin);
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hl = s => { const t = esc(s); if (!state.q) return t; const re = new RegExp('(' + state.q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'); return t.replace(re, '<mark>$1</mark>'); };
const planBadge = p => `<span class="badge ${p === 'part_time' ? 'pt' : 'ft'}">${PLAN_LABEL[p]}${p === 'part_time' ? ' +' : ' only'}</span>`;
const timingBadge = t => `<span class="badge ${TIMING_CLASS[t]}">${TIMING_SHORT[t]}</span>`;
const inPlan = t => state.plan === 'all' || state.plan === 'full_time' || t.plan === 'part_time';
const ctypeHits = () => { const c = DATA.clientTypes.find(x => x.id === state.ctype); const m = {}; if (c) c.firstHandoffs.forEach(h => h.tasks.forEach(id => { m[id] = h.label; })); return m; };

function copyBtn(items) {
  const text = items.map(i => '- ' + i).join('\n');
  return `<button type="button" class="btn" data-copy="${esc(text)}">Copy list</button>`;
}
function checklist(title, items, hint) {
  if (!items || !items.length) return '';
  const q = state.plan === 'part_time';
  return `<section class="section">
    <div class="section-head"><h3>${esc(title)}</h3>${hint ? `<span class="hint">${esc(hint)}</span>` : ''}${copyBtn(items)}</div>
    <ul class="checklist">${items.map(i => `<li class="${q && /\(Full-Time\)/.test(i) ? 'dim' : ''}">${hl(i)}</li>`).join('')}</ul>
  </section>`;
}
function table(cols, rows) {
  return `<div class="table-wrap"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i === 0 ? 'k' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const needBadge = n => n === 'required' ? '<span class="badge req">Required</span>' : '<span class="badge">If used</span>';

      <div class="meta"><span class="badge">${esc(a.planNote)}</span></div>
    </div>
    <div class="tabs" style="--area:${a.color}">${tabs}</div>
    <div style="--area:${a.color}">${body}</div>`;
}

function renderVA() {
  const f = DATA.vaFoundation;
  return `<div class="head"><span class="eyebrow">Every assistant · before any placement</span><h1 class="display">VA foundation</h1><p class="lede">${esc(f.intro)}</p></div>
    ${checklist('What we vet for', f.vetting, 'From How it works and the FAQ')}
    <section class="section"><div class="section-head"><h2 class="display">Training path</h2><span class="hint">Crew Training, in order</span></div>
      <div class="path">${f.trainingPath.map((s, i) => `<div class="phase"><div class="phase-head"><span class="n num">${i + 1}</span><div><h3>${esc(s.stage)}</h3><span class="when">Gate · ${esc(s.gate)}</span></div></div>
        <ul class="checklist">${s.items.map(x => `<li>${hl(x)}</li>`).join('')}</ul></div>`).join('')}</div></section>
    <section class="section"><div class="section-head"><h2 class="display">What you own, and what you never do</h2><span class="hint">${esc(f.boundaries.intro)}</span></div>
      <div class="two"><div class="card" style="border-top:3px solid var(--good)"><span class="eyebrow" style="color:var(--good)">Good to hand off to you</span><ul class="checklist">${f.boundaries.handOff.map(x => `<li>${hl(x)}</li>`).join('')}</ul></div>
      <div class="card" style="border-top:3px solid var(--warn)"><span class="eyebrow" style="color:var(--warn)">Stays with the GC's people</span><ul class="checklist">${f.boundaries.keepWithGc.map(x => `<li>${hl(x)}</li>`).join('')}</ul></div></div></section>
    ${checklist('Internal setup for each placement', f.internalSetup, 'Launcher, CRM, Quo, Gmail, Crew Training')}
    ${checklist('The placement brief', f.placementBrief, 'What the VA is told before the intro call')}
    ${checklist('Working rules', f.workingRules, 'Day 5 of Crew Training, in one list')}
    ${checklist('Brush-up cadence', f.brushUpCadence)}`;
}

function renderPath() {
  const gates = { agreement: 'Gate 1 · the client says yes · billing starts', day14: 'Gate 2 · keep, swap or stop · decided by day 14' };
  const lane = (label, items, color) => `<div class="lane" style="--lane:${color}"><span class="eyebrow">${label}</span>${items.length ? `<ul>${items.map(x => `<li>${hl(x)}</li>`).join('')}</ul>` : '<span class="none">Nothing in this phase</span>'}</div>`;
  return `<div class="head"><span class="eyebrow">One path for every client · day 1 to day 90</span><h1 class="display">Client onboarding path</h1><p class="lede">${esc(DATA.clientPath.intro)}</p></div>
    <div class="path">${DATA.clientPath.phases.map((p, i) => `${p.id === 'agreement' || p.id === 'day14' ? '' : ''}<div class="phase" id="phase-${p.id}">
      <div class="phase-head"><span class="n num">${i + 1}</span><div><h3>${esc(p.name)}</h3><span class="when">${esc(p.when)}</span><p>${esc(p.goal)}</p></div></div>
      <div class="lanes">${lane('Offload Crew', p.offload, 'var(--accent2)')}${lane('The client (GC)', p.client, 'var(--blue)')}${lane('The assistant', p.va, 'var(--good)')}</div>
      <div class="section-head"><span></span>${copyBtn([...p.offload.map(x => 'Offload: ' + x), ...p.client.map(x => 'GC: ' + x), ...p.va.map(x => 'VA: ' + x)])}</div>
    </div>${gates[p.id] ? `<div class="gate">${gates[p.id]}</div>` : ''}`).join('')}</div>`;
}

function renderAccess() {
  const rows = DATA.accessCatalog.map(r => [hl(r.system), hl(r.level), hl(r.grantedBy), hl(r.when), hl(r.revoke), `<div class="chips">${r.areas.map(id => `<span class="chip" style="color:${AREA[id].color}">${esc(AREA[id].short)}</span>`).join('')}</div>`]);
  return `<div class="head"><span class="eyebrow">Every system a client may open to their assistant</span><h1 class="display">Access catalog</h1><p class="lede">The client owns every account and can revoke access at any time. Grant only what the first handoffs need, log each grant in the client's register with the date, and widen at day 30. Shared logins go through a password manager, never email or text.</p></div>
    ${table(['System', 'Level', 'Granted by', 'When', 'Revoke by', 'Used in'], rows)}
    <section class="section"><div class="section-head"><h3>Register template</h3><span class="hint">One per client; from the client checklist</span></div>
    ${table(['Tool', 'Access level', 'Granted on', 'Revoked on'], ['Company email', 'Phone line', 'QuickBooks', 'Job files / shared drive', 'Calendar', 'Construction platform', 'Permit portals', 'Billing portals'].map(t => [esc(t), '<span class="m">—</span>', '<span class="m">—</span>', '<span class="m">—</span>']))}</section>`;
}

function renderClients() {
  const plans = DATA.plans.map(p => `<div class="card"><div class="row">${planBadge(p.id)}<span class="badge">${p.hoursPerWeek} hrs / week</span></div><h3>${esc(p.name)} · <span class="num">${esc(p.priceRange)}</span></h3><p class="prose" style="font-size:13.5px">Best for ${esc(p.bestFor)}. CRM service: ${esc(p.crmService)}.</p><ul style="font-size:13.5px">${p.covers.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>`).join('');
  const matrix = DATA.serviceAreas.map(a => [`<span style="color:${a.color}">${esc(a.name)}</span>`, a.tasks.filter(t => t.plan === 'part_time').map(t => esc(t.name)).join(', ') || '<span class="m">Not included</span>', a.tasks.map(t => esc(t.name)).join(', ')]);
  const types = DATA.clientTypes.map(c => `<div class="card ${state.ctype && state.ctype !== c.id ? 'dim' : ''}"><div class="row">${planBadge(c.typicalPlan).replace(' +', '').replace(' only', '')}<span class="badge">typical plan</span></div><h3>${esc(c.name)}</h3><p class="prose" style="font-size:13.5px">${esc(c.description)}</p>
      <dl><dt>First handoffs</dt><dd><ul style="font-size:13.5px">${c.firstHandoffs.map(h => `<li>${esc(h.label)} <span class="chips" style="display:inline-flex;vertical-align:middle">${h.tasks.map(id => `<a class="chip" href="#${TASK[id].area.id}" style="text-decoration:none">${esc(TASK[id].name)}</a>`).join('')}</span></li>`).join('')}</ul></dd>
      <dt>Likely tools</dt><dd>${c.likelyTools.map(esc).join(' · ')}</dd></dl></div>`).join('');
  return `<div class="head"><span class="eyebrow">Pricing and Services pages</span><h1 class="display">Plans & client types</h1><p class="lede">Two plans, no upfront cost, a 2-week trial on every placement. Five kinds of contractor, each with the handoffs they usually start with.</p></div>
    <section class="section"><div class="section-head"><h2 class="display">Plans</h2></div><div class="grid">${plans}</div></section>
    <section class="section"><div class="section-head"><h3>What each plan covers, by area</h3></div>${table(['Service area', 'Part-Time (20 hrs)', 'Full-Time (40 hrs)'], matrix)}</section>
    <section class="section"><div class="section-head"><h2 class="display">Client types</h2><span class="hint">Pick one in the top bar to mark its first handoffs on every area</span></div><div class="grid">${types}</div></section>`;
}

function renderSales() {
  const S = DATA.sales;
  const stClass = { settled: 'settled', open: 'open', 'correct the doc': 'fix', 'settled by the access catalog': 'settled' };
  const rows = S.offerStatus.rows.map(r => [hl(r.item), `<span class="badge">${esc(r.doc)}</span>`, hl(r.site), `<span class="status ${stClass[r.status] || 'open'}">${esc(r.status)}</span>`, hl(r.note || '')]);
  const disc = S.discoveryQuestions.map(g => { const a = AREA[g.area]; return `<section class="section" style="--area:${a.color}"><div class="section-head"><h3><a href="#${a.id}" style="color:${a.color};text-decoration:none">${esc(a.name)}</a></h3>${copyBtn(g.questions)}</div><ul class="checklist">${g.questions.map(q => `<li>${hl(q)}</li>`).join('')}</ul></section>`; }).join('');
  const who = S.byWhoHasIt.map(w => `<article class="card"><p class="say">${hl(w.says)}</p>
      <dl><dt>Often hides</dt><dd>${hl(w.hides)}</dd><dt>Ask</dt><dd>${hl(w.ask)}</dd><dt>Add</dt><dd>${hl(w.add)}</dd>${w.tasks.length ? `<dt>Tasks</dt><dd><div class="chips">${w.tasks.map(id => `<a class="chip" href="#${TASK[id].area.id}" style="text-decoration:none">${esc(TASK[id].name)}</a>`).join('')}</div></dd>` : ''}</dl></article>`).join('');
  return `<div class="head"><span class="admin-note">Admins only · hidden from assistants</span><h1 class="display">Sales plays</h1><p class="lede">${esc(S.intro)}</p></div>
    ${checklist('Positioning', S.positioning)}
    <section class="section"><div class="section-head"><h2 class="display">Offer status against the website</h2><span class="hint">${esc(S.offerStatus.intro)}</span></div>${table(['Item', 'Deep Dive said', 'The website says', 'Status', 'What to do'], rows)}</section>
    <section class="section"><div class="section-head"><h2 class="display">The pilot</h2></div><div class="two">
      <div class="card" style="border-top:3px solid var(--accent)"><span class="eyebrow">Default · the website offer</span><p>${hl(S.pilot.default)}</p></div>
      <div class="card" style="border-top:3px solid var(--blue)"><span class="eyebrow">Add-on · when they already have someone</span><p>${hl(S.pilot.addOn)}</p></div></div>
      <p class="prose">${hl(S.pilot.rule)}</p></section>
    <section class="section"><div class="section-head"><h2 class="display">Discovery questions</h2><span class="hint">Ask on the free call, by the areas on the table; answers go in the CRM notes</span></div><div class="path">${disc}</div></section>
    <section class="section"><div class="section-head"><h2 class="display">When they say “I already have someone”</h2><span class="hint">${esc(S.pivot.line)}</span></div>
      <p class="prose">${hl(S.pivot.intro)}</p>
      <div class="two"><div class="card"><span class="eyebrow">The four moves</span><ol style="padding-left:1.2em;display:grid;gap:8px;margin:0">${S.pivot.moves.map(m => `<li>${hl(m)}</li>`).join('')}</ol></div>
      <div class="card"><div class="section-head"><span class="eyebrow">Edge-finding questions</span>${copyBtn(S.pivot.edgeQuestions)}</div><ul class="checklist">${S.pivot.edgeQuestions.map(q => `<li>${hl(q)}</li>`).join('')}</ul></div></div>
      <div class="card"><span class="eyebrow">Example</span><ul class="script" style="padding:0;margin:0">${S.pivot.example.map(l => `<li>${hl(l)}</li>`).join('')}</ul></div></section>
    <section class="section"><div class="section-head"><h2 class="display">By who they say has it</h2><span class="hint">Common patterns, not guarantees. Each is a question until the GC confirms it</span></div><div class="grid">${who}</div></section>
    <section class="section"><div class="section-head"><h3>What the VA owns and what the GC keeps</h3><a class="btn" href="#va">See the boundaries</a></div>
      <div class="two"><div class="card"><span class="eyebrow" style="color:var(--good)">Good to hand off</span><p style="font-size:13.5px">${DATA.vaFoundation.boundaries.handOff.map(esc).join(' · ')}</p></div><div class="card"><span class="eyebrow" style="color:var(--warn)">Keep with the GC</span><p style="font-size:13.5px">${DATA.vaFoundation.boundaries.keepWithGc.map(esc).join(' · ')}</p></div></div></section>
    ${checklist('Guardrails', S.guardrails)}
    ${checklist('Open items', S.openItems, 'From the Deep Dive review comments; settle before promising specifics')}`;
}

function renderSearch() {
  const q = state.q.toLowerCase();
  const has = s => String(s || '').toLowerCase().includes(q);
  const out = [];
  DATA.serviceAreas.forEach(a => {
    a.tasks.forEach(t => { if ([t.name, t.what, t.approval, t.cadence, ...t.deliverables, ...t.training].some(has)) out.push({ where: a.short + ' · task', view: a.id, sub: 'tasks', text: `<b>${hl(t.name)}</b> ${hl(t.what)} ${hl(t.approval)}` }); });
    const v = a.vaOnboarding, c = a.clientOnboarding;
    [['Brush up', v.brushUp], ['Readiness', v.readiness], ['First week', v.firstWeekSetup]].forEach(([l, items]) => items.forEach(x => { if (has(x)) out.push({ where: a.short + ' · VA', view: a.id, sub: 'va', text: `<b>${l}</b> ${hl(x)}` }); }));
    if (a.primer) [['Why', [a.primer.why]], ['Term', a.primer.terms], ['Goes wrong', a.primer.goesWrong]].forEach(([l, items]) => items.forEach(x => { if (has(x)) out.push({ where: a.short + ' · know', view: a.id, sub: 'know', text: `<b>${l}</b> ${hl(x)}` }); }));
    v.requiredModules.forEach(m => { if ([m.module, m.title, m.why].some(has)) out.push({ where: a.short + ' · VA', view: a.id, sub: 'va', text: `<b>${hl(m.title)}</b> ${hl(m.why)}` }); });
    c.techStack.forEach(t => { if ([t.tool, t.purpose].some(has)) out.push({ where: a.short + ' · client', view: a.id, sub: 'client', text: `<b>${hl(t.tool)}</b> ${hl(t.purpose)}` }); });
    c.access.forEach(r => { if ([r.system, r.level, r.when].some(has)) out.push({ where: a.short + ' · access', view: a.id, sub: 'client', text: `<b>${hl(r.system)}</b> ${hl(r.level)}` }); });
    [['Hands over', c.inputs], ['Decides', c.decisions]].forEach(([l, items]) => items.forEach(x => { if (has(x)) out.push({ where: a.short + ' · client', view: a.id, sub: 'client', text: `<b>${l}</b> ${hl(x)}` }); }));
  });
  DATA.clientPath.phases.forEach(p => [['Offload', p.offload], ['GC', p.client], ['VA', p.va]].forEach(([l, items]) => items.forEach(x => { if (has(x)) out.push({ where: 'Client path', view: 'path', text: `<b>${esc(p.name)} · ${l}</b> ${hl(x)}` }); })));
  const f = DATA.vaFoundation;
  [['Vetting', f.vetting], ['Internal setup', f.internalSetup], ['Placement brief', f.placementBrief], ['Working rules', f.workingRules], ['Brush-up cadence', f.brushUpCadence]].forEach(([l, items]) => items.forEach(x => { if (has(x)) out.push({ where: 'VA foundation', view: 'va', text: `<b>${l}</b> ${hl(x)}` }); }));
  f.trainingPath.forEach(s => s.items.forEach(x => { if (has(x) || has(s.stage)) out.push({ where: 'VA foundation', view: 'va', text: `<b>${esc(s.stage)}</b> ${hl(x)}` }); }));
  DATA.accessCatalog.forEach(r => { if ([r.system, r.level, r.when, r.revoke].some(has)) out.push({ where: 'Access catalog', view: 'access', text: `<b>${hl(r.system)}</b> ${hl(r.level)}` }); });
  if (isAdmin()) {
    const S = DATA.sales;
    S.discoveryQuestions.forEach(g => g.questions.forEach(x => { if (has(x)) out.push({ where: 'Sales · discovery', view: 'sales', text: `<b>${esc(AREA[g.area].short)}</b> ${hl(x)}` }); }));
    S.offerStatus.rows.forEach(r => { if ([r.item, r.site, r.note].some(has)) out.push({ where: 'Sales · offer', view: 'sales', text: `<b>${hl(r.item)}</b> ${hl(r.site)} ${hl(r.note || '')}` }); });
    S.byWhoHasIt.forEach(w => { if ([w.says, w.hides, w.ask, w.add].some(has)) out.push({ where: 'Sales · pivot', view: 'sales', text: `<b>${hl(w.says)}</b> ${hl(w.add)}` }); });
    [['Guardrail', S.guardrails], ['Open item', S.openItems], ['Positioning', S.positioning], ['Edge question', S.pivot.edgeQuestions]].forEach(([l, items]) => items.forEach(x => { if (has(x)) out.push({ where: 'Sales', view: 'sales', text: `<b>${l}</b> ${hl(x)}` }); }));
  }
  [...DATA.vaFoundation.boundaries.handOff.map(x => ['Hand off', x]), ...DATA.vaFoundation.boundaries.keepWithGc.map(x => ['Keep with the GC', x])].forEach(([l, x]) => { if (has(x)) out.push({ where: 'VA foundation', view: 'va', text: `<b>${l}</b> ${hl(x)}` }); });
  DATA.clientTypes.forEach(c => { if ([c.name, c.description, ...c.likelyTools, ...c.firstHandoffs.map(h => h.label)].some(has)) out.push({ where: 'Client types', view: 'clients', text: `<b>${hl(c.name)}</b> ${hl(c.description)}` }); });
  return `<div class="head"><span class="eyebrow">Search</span><h1 class="display">${out.length} result${out.length === 1 ? '' : 's'} for “${esc(state.q)}”</h1>${out.length ? '' : '<p class="lede">Nothing matches. Try a tool name, a document (COI, G703, W-9) or a task.</p>'}</div>
    <div class="section">${out.slice(0, 80).map(r => `<a class="result" href="#${r.view}" data-sub="${r.sub || ''}"><span class="where">${esc(r.where)}</span><span class="what">${r.text}</span></a>`).join('')}</div>`;
}

/* ── Shell ── */
function renderRail() {
  const vs = visibleViews();
  const groups = [...new Set(vs.map(v => v.group))];
  document.getElementById('rail').innerHTML = groups.map(g => `<div class="group"><span class="eyebrow">${g}</span>${vs.filter(v => v.group === g).map(v => `<a href="#${v.id}" class="${state.view === v.id ? 'on' : ''}">${v.code ? `<span class="code" style="${state.view === v.id ? `background:${v.color}` : ''}">${v.code}</span>` : ''}${esc(v.label)}</a>`).join('')}</div>`).join('');
}
function render() {
  const page = document.getElementById('page');
  let html;
  if (state.q.length >= 2) html = renderSearch();
  else if (AREA[state.view]) html = renderArea(AREA[state.view]);
  else html = ({ overview: renderOverview, va: renderVA, path: renderPath, access: renderAccess, clients: renderClients, sales: renderSales }[state.view] || renderOverview)();
  page.innerHTML = html + `<div class="foot">Built from ${DATA.sources.filter(s => s.url).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name.replace('offloadcrew.com · ', ''))}</a>`).join(', ')} on offloadcrew.com, the Client Onboarding Checklist, the Crew Training desks and the Offload CRM. Updated ${esc(DATA.updatedOn)}.</div>`;
  renderRail();
  document.querySelectorAll('[data-plan]').forEach(b => b.classList.toggle('on', b.dataset.plan === state.plan));
}
function setView(id) {
  state.view = visibleViews().some(v => v.id === id) ? id : 'overview';
  document.querySelector('.main').scrollTop = 0; window.scrollTo(0, 0);
  render();
}

document.getElementById('page').addEventListener('click', e => {
  const academy = e.target.closest('a[data-academy]');
  if (academy) {
    if (window.top !== window.self) { e.preventDefault(); openAcademy(academy.dataset.academy); }
    return;
  }
  const sub = e.target.closest('[data-sub]');
  if (sub && sub.classList.contains('tab')) {
    state.subtab[state.view] = sub.dataset.sub; persist(); render();
    // Keep the address shareable: #<area>/<tab>. replaceState does not fire hashchange.
    if (AREA[state.view]) history.replaceState(null, '', '#' + state.view + '/' + sub.dataset.sub);
    return;
  }
  if (sub && sub.classList.contains('result')) { const v = sub.getAttribute('href').slice(1); if (sub.dataset.sub) state.subtab[v] = sub.dataset.sub; state.q = ''; document.getElementById('q').value = ''; persist(); }
  const c = e.target.closest('[data-copy]');
  if (c) {
    const text = c.dataset.copy;
    const done = () => { c.textContent = 'Copied'; c.classList.add('ok'); setTimeout(() => { c.textContent = 'Copy list'; c.classList.remove('ok'); }, 1500); };
    const fallback = () => { const ul = c.closest('.section, .phase')?.querySelector('ul'); if (!ul) return; const r = document.createRange(); r.selectNodeContents(ul); const s = getSelection(); s.removeAllRanges(); s.addRange(r); c.textContent = 'Select and copy'; };
    (navigator.clipboard?.writeText(text) || Promise.reject()).then(done, fallback);
  }
});
document.querySelectorAll('[data-plan]').forEach(b => b.addEventListener('click', () => { state.plan = b.dataset.plan; persist(); render(); }));
const sel = document.getElementById('ctype');
DATA.clientTypes.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; sel.appendChild(o); });
sel.value = state.ctype;
sel.addEventListener('change', () => { state.ctype = sel.value; persist(); render(); });
const qi = document.getElementById('q');
qi.addEventListener('input', () => { state.q = qi.value.trim(); render(); });
// #<view>, or #<areaId>/<tab> with tab one of tasks · know · va · client.
function applyHash() {
  const [id, tab] = location.hash.replace(/^#/, '').split('/');
  if (AREA[id] && TABS.includes(tab)) { state.subtab[id] = tab; persist(); }
  setView(id || 'overview');
}
window.addEventListener('hashchange', applyHash);
applyHash();

// The launcher role and the Crew Training address come from /api/apps (the
// guard in <head> already asked). Admins then fetch the sales block; the server
// refuses everyone else, so an assistant's browser never holds it.
(window.launcherSession || Promise.resolve(null)).then(async data => {
  if (!data) return;
  let changed = false;
  const training = (data.apps || []).find(a => a.key === 'training');
  if (training && training.url && training.url !== trainingUrl) { trainingUrl = training.url; changed = true; }
  if (data.role === 'admin' || data.role === 'superadmin') {
    let r = null;
    try { r = await LauncherAuth.api('/api/knowledge'); } catch {}
    if (r && r.status === 200 && r.data && r.data.sales) { DATA.sales = r.data.sales; state.role = 'admin'; changed = true; }
  }
  if (!changed) return;
  const wanted = location.hash.replace(/^#/, '').split('/')[0];
  if (wanted === 'sales' && state.view !== 'sales' && isAdmin()) setView('sales');
  else render();
});
</script>
</body>
</html>
